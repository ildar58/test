services:
  # ---------------------------------------------------------------------------
  # Demo upstream app (simple static SPA)
  # ---------------------------------------------------------------------------
  demo-app:
    image: nginx:alpine
    volumes:
      - ../demo-app:/usr/share/nginx/html:ro
    expose:
      - "80"

  # ---------------------------------------------------------------------------
  # Session ingestion + replayer backend (Node/Express)
  #
  # ./data is a host bind-mount so recorded sessions land in the repo's
  # ingestion/data/ directory — `ls`/`cat` from outside the container.
  # NOTE: the container runs as root, so files appear root-owned on the host;
  # use `sudo` to inspect or rm them, or `chown` after a `docker compose down`.
  # ./replayer is mounted read-only so the static replayer UI served at
  # /replay is reachable from the Docker stack without rebuilding the image.
  # ---------------------------------------------------------------------------
  ingestion:
    build:
      context: ../ingestion
      dockerfile: Dockerfile
    volumes:
      - ../ingestion/data:/app/data
      - ../replayer:/app/replayer:ro
    expose:
      - "3001"
    environment:
      PORT: "3001"

  # ---------------------------------------------------------------------------
  # nginx proxy: injects recorder into every HTML response from demo-app
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"    # corp app (with recorder injected)
      - "8081:8080"  # replayer admin UI
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy_defaults.conf:/etc/nginx/snippets/proxy_defaults.conf:ro
      - ./recorder-bundle:/srv/recorder-bundle:ro
    depends_on:
      - demo-app
      - ingestion
