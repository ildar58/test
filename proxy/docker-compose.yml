services:
  # ---------------------------------------------------------------------------
  # Демо-приложение (простая статическая SPA)
  # ---------------------------------------------------------------------------
  demo-app:
    image: nginx:alpine
    volumes:
      - ../demo-app:/usr/share/nginx/html:ro
    expose:
      - "80"

  # ---------------------------------------------------------------------------
  # Ingestion сессий + бэкенд реплеера (Node/Express)
  #
  # ./data — bind-mount на хост, чтобы записанные сессии ложились в
  # ingestion/data/ репозитория и читались `ls`/`cat` снаружи контейнера.
  # Контейнер работает под root, поэтому файлы на хосте root-owned:
  # смотри/удаляй через sudo либо chown после `docker compose down`.
  # ./replayer монтируется read-only, чтобы статический UI реплеера на
  # /replay был доступен из стека без пересборки образа.
  # ---------------------------------------------------------------------------
  ingestion:
    build:
      context: ../ingestion
      dockerfile: Dockerfile
    volumes:
      - ../ingestion/data:/app/data
      - ../replayer:/app/replayer:ro
    expose:
      - "3001"
    environment:
      PORT: "3001"

  # ---------------------------------------------------------------------------
  # nginx-прокси: инжектит рекордер в каждый HTML-ответ demo-app
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"    # корп-приложение (с инжектом рекордера)
      - "8081:8080"  # админ-UI реплеера
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy_defaults.conf:/etc/nginx/snippets/proxy_defaults.conf:ro
      - ./recorder-bundle:/srv/recorder-bundle:ro
    depends_on:
      - demo-app
      - ingestion
