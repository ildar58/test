# Pam Session Recorder — nginx reverse proxy with rrweb injection
# Tested with nginx 1.25+
# Requires modules: ngx_http_sub_module (bundled in nginx-full / official docker image)
#
# NOTE: set_secure_random_alphanum (for CSP nonces) requires nginx-plus or
# lua-nginx-module. For open-source nginx, generate the nonce in the upstream
# app or use a static placeholder and add a 'nonce-VALUE' to the CSP header.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Common proxy headers — included in every reverse-proxy location.
    # See proxy_defaults.conf next to nginx.conf in the repo.

    upstream corp_app  { server demo-app:80;       }
    upstream ingestion { server ingestion:3001;    }

    # ------------------------------------------------------------------
    # Public-facing app (corp UI with recorder injected)
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # 1. Recorder bundle as static — avoids one proxy hop.
        location /_rec/ {
            alias /srv/recorder-bundle/;
            add_header Cache-Control "public, max-age=3600";
        }

        # 2. Forward batch ingestion endpoint.
        location /s/ {
            include /etc/nginx/snippets/proxy_defaults.conf;
            proxy_pass http://ingestion/s/;
        }

        # 3. Forward auth endpoints. Cookies flow same-origin.
        #    The production Go service would replace `ingestion` here.
        location /auth/ {
            include /etc/nginx/snippets/proxy_defaults.conf;
            proxy_pass http://ingestion/auth/;
        }

        # 4. Forward /sessions for the replayer (read-only metadata listing).
        location /sessions {
            include /etc/nginx/snippets/proxy_defaults.conf;
            proxy_pass http://ingestion/sessions;
        }

        # 5. Everything else → corp app, with recorder script injected.
        location / {
            include /etc/nginx/snippets/proxy_defaults.conf;
            proxy_pass http://corp_app;

            # CRITICAL: disable upstream compression so sub_filter can edit the body.
            proxy_set_header Accept-Encoding "";

            # Inject recorder just before </head>. The SDK stays IDLE and
            # activates only after the backend sets a session_present marker
            # cookie; stops when the marker is cleared.
            sub_filter_once on;
            sub_filter_types text/html;
            # Recorder config via data-* on the injected tag (read by the bundle
            # on load). Supported: data-endpoint, data-marker-cookie,
            # data-session-id-cookie, data-flush-interval-ms, data-marker-poll-ms,
            # data-max-buffer-size, data-checkout-every-ms,
            # data-unauthorized-threshold, data-unauthorized-cooldown-ms,
            # data-block-class, data-ignore-class, data-mask-text-class,
            # data-mask-all-inputs, data-inline-stylesheet, data-collect-fonts,
            # data-record-cross-origin-iframes. Omitted -> SDK DEFAULT_CONFIG.
            sub_filter '</head>' '<script src="/_rec/recorder.iife.js" data-endpoint="/s/"></script></head>';

            # CSP (optional): with a nonce-generating module, restrict scripts.
            #   add_header Content-Security-Policy "script-src 'self' 'nonce-...' /_rec/; ...";
        }
    }

    # ------------------------------------------------------------------
    # Replayer admin UI on a separate port — NOT exposed publicly in prod.
    # ------------------------------------------------------------------
    server {
        listen 8080;
        server_name _;

        location / {
            include /etc/nginx/snippets/proxy_defaults.conf;
            proxy_pass http://ingestion/replay/;
        }

        location /sessions {
            include /etc/nginx/snippets/proxy_defaults.conf;
            proxy_pass http://ingestion/sessions;
        }

        location /s/ {
            include /etc/nginx/snippets/proxy_defaults.conf;
            proxy_pass http://ingestion/s/;
        }
    }
}
