# nginx прокси с инжекцией rrweb
# ngx_http_sub_module нужен (в официальном docker-образе есть)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # дефолтный лимит тела запроса; крупные батчи разрешаем точечно на /s/
    client_max_body_size 1m;

    # базовые security-заголовки (наследуются туда, где нет своих add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # общие proxy-заголовки вынесены в proxy_defaults.conf

    upstream corp_app  { server demo-app:80;       }
    upstream ingestion { server ingestion:3001;    }

    # корпоративное приложение с инжекцией рекордера
    server {
        listen 80;
        server_name _;

        # бандл рекордера отдаём статикой
        location /_rec/ {
            alias /srv/recorder-bundle/;
            # свой add_header сбрасывает наследование — дублируем security-заголовки
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # батчи событий (крупные тела допускаем здесь)
        location /s/ {
            client_max_body_size 11m;
            include /etc/nginx/snippets/proxy_defaults.conf;
            proxy_pass http://ingestion/s/;
        }

        # auth, куки идут same-origin
        location /auth/ {
            include /etc/nginx/snippets/proxy_defaults.conf;
            proxy_pass http://ingestion/auth/;
        }

        # /sessions НАМЕРЕННО не публикуется на корп-порту — список и чтение
        # записей доступны только на внутреннем порту реплеера (8080→8081).

        # всё остальное на корп-приложение с инжекцией рекордера
        location / {
            include /etc/nginx/snippets/proxy_defaults.conf;
            proxy_pass http://corp_app;

            # сжатие отключаем, иначе sub_filter не сработает
            proxy_set_header Accept-Encoding "";

            sub_filter_once on;
            sub_filter_types text/html;
            # конфиг рекордера через data-* атрибуты ниже
            sub_filter '</head>' '<script src="/_rec/recorder.iife.js" data-endpoint="/s/"></script></head>';

            # CSP (опционально): с модулем генерации nonce можно ограничить скрипты.
            #   add_header Content-Security-Policy "script-src 'self' 'nonce-...' /_rec/; ...";
        }
    }

    # реплеер на отдельном порту, наружу не торчит
    server {
        listen 8080;
        server_name _;

        location / {
            include /etc/nginx/snippets/proxy_defaults.conf;
            proxy_pass http://ingestion/replay/;
        }

        location /sessions {
            include /etc/nginx/snippets/proxy_defaults.conf;
            proxy_pass http://ingestion/sessions;
        }

        location /s/ {
            include /etc/nginx/snippets/proxy_defaults.conf;
            proxy_pass http://ingestion/s/;
        }
    }
}
