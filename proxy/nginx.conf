# Corp Session Recorder — nginx reverse proxy with rrweb injection
# Tested with nginx 1.25+
# Requires modules: ngx_http_sub_module (bundled in nginx-full / official docker image)

# NOTE: set_secure_random_alphanum requires nginx-plus or lua-nginx-module.
# For open-source nginx, generate the nonce in the upstream app or use
# a static placeholder and add a 'nonce-VALUE' to the CSP header.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # ------------------------------------------------------------------
    # Upstream: the real corp app
    # ------------------------------------------------------------------
    upstream corp_app {
        server demo-app:80;
    }

    # ------------------------------------------------------------------
    # Upstream: ingestion service (Node)
    # ------------------------------------------------------------------
    upstream ingestion {
        server ingestion:3001;
    }

    # ------------------------------------------------------------------
    # Main virtual host
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # ---------------------------------------------------------------
        # 1. Serve recorder bundle as static — avoids one proxy hop
        # ---------------------------------------------------------------
        location /_rec/ {
            alias /srv/recorder-bundle/;
            add_header Cache-Control "public, max-age=3600";
            add_header Access-Control-Allow-Origin "*";
        }

        # ---------------------------------------------------------------
        # 2. Forward /s/ to ingestion service
        # ---------------------------------------------------------------
        location /s/ {
            proxy_pass http://ingestion/s/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # No Content-Length manipulation needed for POST JSON
        }

        # ---------------------------------------------------------------
        # 3. Forward /sessions to ingestion (replayer uses this)
        # ---------------------------------------------------------------
        location /sessions {
            proxy_pass http://ingestion/sessions;
            proxy_set_header Host $host;
        }

        # ---------------------------------------------------------------
        # 4. All other requests → corp app with script injection
        # ---------------------------------------------------------------
        location / {
            proxy_pass http://corp_app;

            # CRITICAL: disable compression on upstream response so
            # sub_filter can operate on plain text.
            proxy_set_header Accept-Encoding "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Inject recorder just before </head>
            # The snippet auto-starts with session_id from sessionStorage (persistent per tab).
            sub_filter_once on;
            sub_filter_types text/html;
            sub_filter '</head>' '<script src="/_rec/recorder.iife.js"></script><script>window.PamRecorder&&window.PamRecorder.init({endpoint:"/s/"});</script></head>';

            # ---------------------------------------------------------------
            # CSP: add nonce to script-src
            # For nginx-plus / lua-nginx: generate nonce dynamically.
            # For open-source nginx: either use a fixed nonce (not ideal)
            # or let the upstream app generate it.
            # ---------------------------------------------------------------
            # add_header Content-Security-Policy "script-src 'self' 'nonce-REPLACE_ME_WITH_NONCE' /_rec/; ...";
        }
    }

    # ------------------------------------------------------------------
    # Replayer admin UI on separate port (not exposed publicly in prod)
    # ------------------------------------------------------------------
    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://ingestion/replay/;
        }

        location /sessions {
            proxy_pass http://ingestion/sessions;
        }

        location /s/ {
            proxy_pass http://ingestion/s/;
        }
    }
}
